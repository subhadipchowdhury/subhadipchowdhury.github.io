---
layout: compress
---

<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  {% assign style_preview_pages = "Teaching|Pedagogy|Mentoring|Research" | split: "|" %}
  <body class="page-{{ page.title | downcase | replace: ' ', '-' }}{% if style_preview_pages contains page.title %} style-variant-a{% endif %}">
    <header class="site-header">
      <div class="site-header__inner">
        <h1><a href="{{ '/' | relative_url }}">Subhadip Chowdhury</a></h1>
        <div class="header-actions">
          {% include navigation.html %}
          <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
            <i class="fa-solid fa-sun" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="main-wrapper">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
