theme: jekyll-theme-cayman
kramdown:
  parse_block_html: true

permalink: pretty

url: "https://subhadipchowdhury.github.io/"
description: "Personal academic website of Subhadip Chowdhury: teaching, pedagogy, research, and mentoring."
  
# tools/ holds the lab build scripts, test suites and the mechanics demo, and
# teaching/labs/wip/ the lab design document and its draft notebooks. Both
# belong in the repo and neither should be served as part of the site.
exclude: ['deploy', 'stylesheet.scss', 'tools', 'teaching/labs/wip', 'HANDOFF.md']

defaults:

  - scope:
      path: ""
    values:
      robots: true

compress_html:
  clippings: all
  blanklines: true
