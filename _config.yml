theme: jekyll-theme-cayman
kramdown:
  parse_block_html: true

permalink: pretty

url: "https://subhadipchowdhury.github.io/"
description: "Personal academic website of Subhadip Chowdhury: teaching, pedagogy, research, and mentoring."
  
# tools/ holds the build scripts, the test suites, the authoring scripts and the
# design notes; it belongs in the repo and none of it should be served.
#
# teaching/labs/notebooks/ is excluded too. Colab opens a notebook from its
# GitHub blob URL, never from this site, and a lab is the way into its notebook,
# so serving the .ipynb files would only publish a route around the puzzles.
exclude:
  - deploy
  - stylesheet.scss
  - tools
  - teaching/labs/notebooks
  - HANDOFF.md

defaults:

  - scope:
      path: ""
    values:
      robots: true

compress_html:
  clippings: all
  blanklines: true
