<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;background:#ffffff;border:1px solid #00000010;border-radius:20px;box-shadow:0 14px 32px -22px #00000066;overflow:hidden;height:100%;transition:transform .18s ease, box-shadow .18s ease;" style-hover="transform:translateY(-4px);box-shadow:0 24px 48px -22px #00000073;">
  <div style="height:126px;position:relative;background:repeating-linear-gradient(135deg,#0000 0 13px,#0000000a 13px 14px), linear-gradient(135deg,#F5F2EC,#ECE8E1);display:flex;align-items:flex-end;padding:12px;">
    <span style="position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;background:#ffffffec;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:600;color:#2c2a26;">
      <span style="width:8px;height:8px;border-radius:50%;background:{{ activity.accent }};"></span>{{ activity.courseName }}
    </span>
    <span style="position:absolute;top:12px;right:12px;background:{{ activity.statusBg }};color:{{ activity.statusFg }};font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;">{{ activity.statusLabel }}</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#00000066;background:#ffffffd6;padding:3px 8px;border-radius:7px;">{{ activity.thumb }}</span>
  </div>
  <div style="padding:15px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1;">
    <div style="display:flex;">
      <span style="display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:{{ activity.accent }};background:{{ activity.accentSoft }};padding:3px 9px;border-radius:999px;">{{ activity.topic }}</span>
    </div>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16.5px;line-height:1.2;letter-spacing:-.01em;color:#161512;text-wrap:pretty;">{{ activity.title }}</div>
    <div style="font-size:12.5px;line-height:1.5;color:#00000099;flex:1;text-wrap:pretty;">{{ activity.blurb }}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <sc-for list="{{ activity.libs }}" as="lib" hint-placeholder-count="3">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#00000073;background:#00000008;border:1px solid #0000000f;padding:3px 8px;border-radius:999px;">{{ lib }}</span>
      </sc-for>
    </div>
    <div style="display:flex;gap:8px;align-items:stretch;margin-top:6px;">
      <a href="#" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:{{ activity.accent }};color:#ffffff;font-weight:600;font-size:12.5px;padding:9px 12px;border-radius:12px;">▶ Launch</a>
      <a href="#" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#00000099;font-weight:600;font-size:12.5px;padding:9px 12px;border-radius:12px;border:1px solid #00000016;">Notebook</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:264,&quot;height&quot;:330},&quot;activity&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
